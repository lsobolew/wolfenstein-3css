name: Pages

# The site in dist/ is committed, because the build inputs are the original
# Wolfenstein 3D data files and those cannot be redistributed. So CI does not
# rebuild it — it verifies it, then publishes it.
#
# The verification is not a formality. "No JavaScript" is the whole claim of
# this project, and a claim a human can forget to re-check is a claim that will
# eventually be false. build/check.mjs fails the run on a single <script> tag,
# an on* attribute, a javascript: URL, or a link pointing at a file that is not
# in dist/.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    name: Verify the build output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: No JavaScript, no dead links
        run: node build/check.mjs
      - name: Generators still parse
        run: |
          node --check build/extract.mjs
          node --check build/generate.mjs

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
